version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: obsidian-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - obsidian-network

  # Obsidian Panel (Node.js Backend serves everything on port 5000)
  obsidian-panel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obsidian-panel
    depends_on:
      - mongo
    ports:
      - "5000:5000" # Web panel (API + Frontend + Socket.IO)
      - "25565:25565" # Minecraft Java Edition
      - "25565:25565/udp"
      - "19132:19132" # Minecraft Bedrock Edition
      - "19132:19132/udp"
      - "24454:24454" # RCON
    environment:
      # Database
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017}
      - MONGO_DB_NAME=${MONGO_DB_NAME:-obsidian_panel}
      - SESSION_SECRET=${SESSION_SECRET:-change_me_in_production}

      # Server Configuration
      - PORT=5000
      - MC_SERVER_BASE_PATH=${MC_SERVER_BASE_PATH:-/minecraft_server}
      - TEMP_BACKUP_PATH=${TEMP_BACKUP_PATH:-/tmp/obsidian_backups}

      # Optional: Custom Java paths
      - JAVA_8_HOME=${JAVA_8_HOME}
      - JAVA_17_HOME=${JAVA_17_HOME}
      - JAVA_21_HOME=${JAVA_21_HOME}
      - JAVA_25_HOME=${JAVA_25_HOME}
    volumes:
      - minecraft_data:/minecraft_server
      - backup_temp:/tmp/obsidian_backups
    restart: unless-stopped
    networks:
      - obsidian-network

# Named volumes for data persistence
volumes:
  mongo_data:
    driver: local
  minecraft_data:
    driver: local
  backup_temp:
    driver: local

# Network for service communication
networks:
  obsidian-network:
    driver: bridge
