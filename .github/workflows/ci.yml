name: CI Integration Test

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]
  workflow_dispatch:

jobs:
  code-quality-and-build:
    name: Code Quality & Build Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Verify Backend Dependencies & Syntax
      run: |
        cd backend
        npm ci
        echo "Checking syntax of server.js and backend modules..."
        node -c server.js
        node -c routes/*.js
        node -c services/*.js
        node -c minecraft-api/*.js
        node -c models/*.js
        node -c middleware/*.js
        cd ..

    - name: Build Frontend
      run: |
        cd frontend
        npm ci
        npm run build
        test -f dist/index.html || (echo "Frontend build missing dist/index.html!" && exit 1)
        echo "Frontend build successful."
        cd ..

  integration-test:
    name: Container & Integration Test
    needs: code-quality-and-build
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})' || mongo --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Get Docker Bridge Gateway IP
      id: network
      run: |
        GATEWAY_IP=$(docker network inspect bridge --format='{{(index .IPAM.Config 0).Gateway}}')
        echo "GATEWAY_IP=$GATEWAY_IP" >> $GITHUB_ENV
        echo "Detected Docker Gateway: $GATEWAY_IP"

    - name: Build Local Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        load: true
        tags: obsidian-panel:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run Install Script
      run: |
        chmod +x install.sh

        # Set environment variables for automated installer execution
        export CI=true
        export CONTAINER_ENGINE=docker
        export engine_choice=1
        export CONTAINER_NAME=obsidian-panel
        export MONGO_URI="mongodb://${{ env.GATEWAY_IP }}:27017/obsidian_test"
        export MONGO_DB_NAME=obsidian_test
        export PANEL_PORT=5000
        export expose_more=n
        export IMAGE_NAME=obsidian-panel:test

        # Run install script with piped input as fallback
        printf "1\nobsidian-panel\nmongodb://${{ env.GATEWAY_IP }}:27017/obsidian_test\nobsidian_test\n5000\nn\n" | ./install.sh

    - name: Wait for Server to Start
      run: |
        echo "Waiting for backend to be ready on port 5000..."
        sleep 10

        # Poll for up to 60 seconds
        for i in {1..15}; do
          if curl -s -f http://localhost:5000 > /dev/null; then
            echo "Obsidian Panel Web UI is responding!"
            exit 0
          fi
          echo "Waiting... (attempt $i/15)"
          sleep 4
        done

        echo "Server failed to start in time."
        docker logs obsidian-panel || true
        exit 1

    - name: Verify API Response & Endpoints
      run: |
        echo "--- Checking Root Endpoint (UI) ---"
        curl -v -f http://localhost:5000/

        echo "--- Checking Auth Status / has-admin Endpoint ---"
        RES=$(curl -s -f http://localhost:5000/api/auth/has-admin)
        echo "Response: $RES"
        echo "$RES" | grep -q "hasAdmin" || (echo "Failed: missing hasAdmin key" && exit 1)
        echo "Endpoints verified successfully!"

    - name: Dump Container Logs
      if: always()
      run: |
        docker logs --tail 100 obsidian-panel || true

    - name: Clean Up Test Container
      if: always()
      run: |
        docker rm -f obsidian-panel &>/dev/null || true
        docker volume rm -f obsidian-data &>/dev/null || true

  build-and-push-docker:
    name: Build & Push Docker Image
    needs: [code-quality-and-build, integration-test]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: docker.io/alexbhai/obsidian-panel
        tags: |
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Get current date
      id: date
      run: echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_DATE=${{ env.DATE }}
          GIT_SHA=${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Image digest
      run: echo ${{ steps.meta.outputs.digest }}
